# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  commit-message:
    prefix: ci
    prefix-development: ci
    include: scope
  groups:
    # github/codeql-action/init and .../analyze must always be on the same version,
    # so bump them together in a single PR
    codeql-action:
      patterns:
        - github/codeql-action*

- package-ecosystem: maven
  directory: /
  schedule:
    interval: daily
  commit-message:
    prefix: fix
    prefix-development: build
    include: scope
  labels:
    - dependencies
