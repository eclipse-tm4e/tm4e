# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Bump Version

on:  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  workflow_dispatch:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
    inputs:
      type:
        description: Type
        default: micro
        required: true
        type: choice
        options:
          - major
          - minor
          - micro


defaults:
  run:
    shell: bash


jobs:

  ###########################################################
  bump-version:
  ###########################################################
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit


    - name: "Show: GitHub context"
      run: |
        python -m json.tool <<'EOT'
        ${{ toJSON(github) }}
        EOT


    - name: "Show: environment variables"
      run: env | sort


    - name: Git Checkout
      # https://github.com/actions/checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # required to prevent tycho-p2-extras-plugin:compare-version-with-baseline potentially failing the build


    - name: Bump Version
      run: python bump-version.py ${{ github.event.inputs.type }}


    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    
    - name: Commit changes
      run: |
        git add .

        projectVersion=$(python -c "import xml.etree.ElementTree as ET; \
        print(ET.parse(open('pom.xml')).getroot().find(  \
        '{http://maven.apache.org/POM/4.0.0}version').text)")

        git commit -m "chore: set tm4e version to $projectVersion"


    - name: Push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git push origin HEAD:${{ github.ref_name }}
