# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Markdown Lint

on:  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  push:
    branches-ignore:  # build all branches except:
    - 'dependabot/**'  # prevent GHA triggered twice (once for commit to the branch and once for opening/syncing the PR)
    tags-ignore:  # don't build tags
    - '**'
    paths:
    - '**/*.md'
  pull_request:
    paths:
    - '**/*.md'
  workflow_dispatch:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch


defaults:
  run:
    shell: bash


jobs:

  ###########################################################
  markdown_lint:
  ###########################################################
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit


    - name: "Show: GitHub context"
      run: |
        python -m json.tool <<'EOT'
        ${{ toJSON(github) }}
        EOT


    - name: "Show: environment variables"
      run: env | sort


    - name: Git Checkout
      # https://github.com/actions/checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


    - name: "Install: Node"
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*


    - name: Install markdownlint-cli
      run: npm install -g markdownlint-cli


    - name: Run markdownlint
      run: markdownlint "**/*.md"
